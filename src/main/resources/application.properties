spring.application.name=jessbijus-api
server.servlet.context-path=/jessbijus
server.port=${PORT:8080}
# A string JDBC e as credenciais ficam apenas no servidor.
spring.datasource.url=${NEON_JDBC_URL}
spring.datasource.username=${NEON_DB_USER}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Isolated authentication schema: existing catalog tables are not baselined or changed by Flyway.
spring.flyway.default-schema=jessbijus_auth
spring.flyway.schemas=jessbijus_auth
spring.flyway.locations=classpath:db/auth-migration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
