spring.application.name=jessbijus-api
server.servlet.context-path=/jessbijus
server.port=${PORT:8080}
# A string JDBC e as credenciais ficam apenas no servidor.
spring.datasource.url=${NEON_JDBC_URL}
spring.datasource.username=${NEON_DB_USER}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
